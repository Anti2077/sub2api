name: Custom and Dev Images

on:
  push:
    branches:
      - Anti2077/custom
      - Anti2077/dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish multi-platform image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image coordinates
        id: image
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            Anti2077/dev)
              variant=dev
              description="Development Sub2API build from Anti2077/dev"
              ;;
            Anti2077/custom)
              variant=custom
              description="Personal Sub2API build from Anti2077/custom"
              ;;
            *)
              echo "Unsupported image branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "variant=${variant}" >> "$GITHUB_OUTPUT"
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          echo "version=${variant}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.image.outputs.variant }}
            type=raw,value=${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.title=Sub2API ${{ steps.image.outputs.variant }}
            org.opencontainers.image.description=${{ steps.image.outputs.description }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TYPE=container
            UPDATE_REPO=${{ github.repository }}
            UPDATE_BRANCH=${{ github.ref_name }}
            UPDATE_IMAGE=${{ steps.image.outputs.name }}:${{ steps.image.outputs.variant }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
