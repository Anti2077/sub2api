<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti2077 AI 中转站 Logo — Concepts</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 32px;
    transition: background-color 0.2s, color 0.2s;
  }
  body.light { background: #f5f5f3; color: #1f2933; }
  body.dark { background: #15191d; color: #f2efe7; }
  .header, .content { width: min(1180px, 100%); margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: 0; }
  h2 { margin: 40px 0 18px; font-size: 18px; letter-spacing: 0; }
  .subtitle { margin-top: 7px; font-size: 14px; opacity: 0.68; }
  .toggle {
    width: 42px;
    height: 42px;
    border: 1px solid currentColor;
    border-radius: 7px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 18px;
  }
  .palette { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .swatch { display: flex; align-items: center; gap: 8px; font: 12px ui-monospace, SFMono-Regular, monospace; }
  .swatch-color { width: 24px; height: 24px; border-radius: 4px; border: 1px solid rgba(128,128,128,.24); }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .card { border: 1px solid rgba(128,128,128,.28); border-radius: 8px; overflow: hidden; }
  .card-img { display: flex; align-items: center; justify-content: center; padding: 24px; min-height: 250px; }
  body.light .card-img { background: #fff; }
  body.dark .card-img { background: #24292e; }
  .card-img img { width: min(100%, 220px); aspect-ratio: 1; }
  .card-label { padding: 12px 14px; font-size: 14px; font-weight: 650; border-top: 1px solid rgba(128,128,128,.28); }
  .card-note { display: block; margin-top: 4px; font-size: 12px; font-weight: 400; opacity: .65; }
  .size-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .size-set { padding: 16px; border: 1px solid rgba(128,128,128,.28); border-radius: 8px; }
  .size-label { margin-bottom: 14px; font-size: 13px; font-weight: 650; }
  .sizes { display: flex; gap: 14px; align-items: end; }
  .sample { text-align: center; font-size: 10px; opacity: .7; }
  .sample img { display: block; margin: 0 auto 5px; }
  @media (max-width: 900px) { .grid, .size-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) {
    body { padding: 18px; }
    .grid, .size-grid { grid-template-columns: 1fr; }
    .card-img { min-height: 230px; }
  }
</style>
</head>
<body class="light">
  <header class="header">
    <div>
      <h1>Anti2077 AI 中转站</h1>
      <p class="subtitle">Logo Concepts · 方形图标 · 纯色系统</p>
    </div>
    <button class="toggle" type="button" title="切换背景" aria-label="切换明暗背景" onclick="toggleTheme(this)">●</button>
  </header>

  <main class="content">
    <div class="palette" aria-label="Color Hunt palette">
      <div class="swatch"><span class="swatch-color" style="background:#3368A0"></span>#3368A0</div>
      <div class="swatch"><span class="swatch-color" style="background:#66A3BF"></span>#66A3BF</div>
      <div class="swatch"><span class="swatch-color" style="background:#C8DFDB"></span>#C8DFDB</div>
      <div class="swatch"><span class="swatch-color" style="background:#F2EFE7"></span>#F2EFE7</div>
    </div>

    <section class="grid" aria-label="Logo concepts">
      <article class="card">
        <div class="card-img"><img src="concepts/concept-1.svg" alt="概念 1，枢纽 A"></div>
        <div class="card-label">01 · 枢纽 A<span class="card-note">三路汇入，一路输出</span></div>
      </article>
      <article class="card">
        <div class="card-img"><img src="concepts/concept-2.svg" alt="概念 2，路由核心"></div>
        <div class="card-label">02 · 路由核心<span class="card-note">四路汇聚，内嵌 2/7</span></div>
      </article>
      <article class="card">
        <div class="card-img"><img src="concepts/concept-3.svg" alt="概念 3，AI 门户"></div>
        <div class="card-label">03 · AI 门户<span class="card-note">A 形网关，二合一信号</span></div>
      </article>
      <article class="card">
        <div class="card-img"><img src="concepts/concept-4.svg" alt="概念 4，A7 道岔"></div>
        <div class="card-label">04 · A7 道岔<span class="card-note">Anti2077 的个人签名感</span></div>
      </article>
    </section>

    <h2>Favicon Size Check</h2>
    <section class="size-grid" aria-label="Small-size checks">
      <div class="size-set"><div class="size-label">01 · 枢纽 A</div><div class="sizes">
        <div class="sample"><img src="concepts/concept-1.svg" width="64" height="64" alt="">64px</div><div class="sample"><img src="concepts/concept-1.svg" width="32" height="32" alt="">32px</div><div class="sample"><img src="concepts/concept-1.svg" width="16" height="16" alt="">16px</div>
      </div></div>
      <div class="size-set"><div class="size-label">02 · 路由核心</div><div class="sizes">
        <div class="sample"><img src="concepts/concept-2.svg" width="64" height="64" alt="">64px</div><div class="sample"><img src="concepts/concept-2.svg" width="32" height="32" alt="">32px</div><div class="sample"><img src="concepts/concept-2.svg" width="16" height="16" alt="">16px</div>
      </div></div>
      <div class="size-set"><div class="size-label">03 · AI 门户</div><div class="sizes">
        <div class="sample"><img src="concepts/concept-3.svg" width="64" height="64" alt="">64px</div><div class="sample"><img src="concepts/concept-3.svg" width="32" height="32" alt="">32px</div><div class="sample"><img src="concepts/concept-3.svg" width="16" height="16" alt="">16px</div>
      </div></div>
      <div class="size-set"><div class="size-label">04 · A7 道岔</div><div class="sizes">
        <div class="sample"><img src="concepts/concept-4.svg" width="64" height="64" alt="">64px</div><div class="sample"><img src="concepts/concept-4.svg" width="32" height="32" alt="">32px</div><div class="sample"><img src="concepts/concept-4.svg" width="16" height="16" alt="">16px</div>
      </div></div>
    </section>
  </main>

<script>
function toggleTheme(button) {
  document.body.classList.toggle('dark')
  document.body.classList.toggle('light')
  button.textContent = document.body.classList.contains('dark') ? '○' : '●'
}
</script>
</body>
</html>
